<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Guide Demo | gta6-map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="../src/neonmap.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="back" href="../index.html">← gta6-map</a>
    <h1>After Dark Eats</h1>
    <p class="note">Demo with made-up restaurants.</p>
    <div class="filters" id="filters"></div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="list" id="list"></div>
  </aside>
  <div id="map" role="application" aria-label="Map of restaurants"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="../src/neonmap.js"></script>
<script src="demo.js"></script>
<script>
runDemo({
  all: 'All food',
  theme: 'midnight',
  imagePrefix: 'food',
  places: [
    { id: 1, name: 'Citrus & Smoke', category: 'Grill', lng: -80.1994, lat: 25.8005, label: '4.8', price: '$$$', description: 'Wood-fired plates, open late.', cta: 'Reserve' },
    { id: 2, name: 'Little Havana Table', category: 'Cuban', lng: -80.2190, lat: 25.7656, label: '4.7', price: '$$', description: 'Family recipes and strong coffee.', cta: 'Reserve' },
    { id: 3, name: 'Tide Raw Bar', category: 'Seafood', lng: -80.1880, lat: 25.7700, label: '4.6', price: '$$$', description: 'Oysters on the river.', cta: 'Reserve' },
    { id: 4, name: 'Neon Noodle', category: 'Asian', lng: -80.1937, lat: 25.7880, label: '4.5', price: '$', description: 'Quick bowls until 2am.', cta: 'Reserve' },
    { id: 5, name: 'Mango Street Tacos', category: 'Mexican', lng: -80.2070, lat: 25.7820, label: '4.4', price: '$', description: 'Tacos, salsa bar and patio.', cta: 'Reserve' }
  ]
});
</script>
</body>
</html>
